name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "tourism_project/deployment/*.joblib"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Register dataset
        run: python tourism_project/model_building/data_register.py
      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Run data preparation
        run: python tourism_project/model_building/prep.py
      - name: Upload train-test splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Download train-test splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
      - name: Start MLflow server
        run: |
          nohup python -m mlflow ui --host 127.0.0.1 --port 5000 > mlflow.log 2>&1 &
          sleep 5
      - name: Build and evaluate model
        run: python tourism_project/model_building/train.py
      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/*.joblib
          git commit -m "Update trained model [skip ci]" || echo "No model changes to commit"
          git push
